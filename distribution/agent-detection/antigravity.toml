# Antigravity CLI (`agy`) declarative agent detection profile (Herdr v2026.10.05.1)
# Spec reference: specs/040-herdr-sulur-harness/contracts/agent-detection-schema.toml

schema_version = 1

[[profiles]]
id = "agy"
version = "2026.10.05.1"
min_engine_version = 1
updated_at = "2026-10-05T00:00:00Z"
aliases = ["antigravity", "antigravity-cli"]
binary_names = ["agy", "agy.exe", "antigravity", "antigravity.exe"]
default_args = []
startup_grace_ms = 3000

[profiles.env]
TERM = "xterm-256color"

[profiles.idle_debounce]
recheck_ms = 100
confirmations = 3
cap_ms = 700

[profiles.approval_inputs]
approve_sequence = "\r"
reject_sequence = "\u001b"
interrupt_sequence = "\u001b"
supports_custom_reply = true

[[profiles.rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["navigate", "tab amend"]

[[profiles.rules]]
id = "question_prompt"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["navigate", "esc skip"]

[[profiles.rules]]
id = "trust_prompt"
state = "blocked"
priority = 280
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["do you trust the contents of this project?", "yes, i trust this folder", "enter confirm"]

[[profiles.rules]]
id = "legacy_permission_prompt"
state = "blocked"
priority = 270
region = "whole_recent"
visible_blocker = true
contains = ["requesting permission for:"]
any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["tab amend", "edit command"] },
]

[[profiles.rules]]
id = "esc_cancel_footer_working"
state = "working"
subphase = "thinking"
priority = 110
region = "bottom_non_empty_lines(2)"
visible_working = true
regex = ['(?m)^\s*─{3,}\s*esc to cancel\b']

[[profiles.rules]]
id = "spinner_working"
state = "working"
subphase = "streaming"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^\s*[\u2801-\u28FF]+\s+\S']
