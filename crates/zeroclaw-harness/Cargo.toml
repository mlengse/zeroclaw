[package]
name = "zeroclaw-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Isolated Herdr-Sulur native harness for ZeroClaw: headless PTY runner, declarative agent detection, Sulur wire bridge, and Discord command bridge."
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = true

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-config.workspace = true
zeroclaw-log.workspace = true
zeroclaw-spawn.workspace = true

anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
parking_lot = "0.12"
portable-pty = "0.9"
regex = "1.10"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "fs"] }
tokio-util = { version = "0.7", default-features = false }
toml = "1.0"
uuid = { version = "1.22", default-features = false, features = ["v4", "v7", "std"] }

[features]
default = []
herdr-sulur-harness = []

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }
